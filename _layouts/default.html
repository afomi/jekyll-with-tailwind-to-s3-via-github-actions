<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <title>{{ page.title }} - {{ site.title }}</title>
    <meta
      name="description"
      content="{{ page.description | default: site.description | default: page.title }}"
    >
    <meta
      property="og:title"
      content="{{ page.title }} - {{ site.title }}"
    >
    <meta
      property="og:description"
      content="{{ page.description | default: site.description | default: page.title }}"
    >
    <meta
      property="og:type"
      content="website"
    >
    {% if page.image %}
    <meta
      property="og:image"
      content="{{ page.image | absolute_url }}"
    >
    {% endif %}
    <link
      rel="icon"
      href="{{ "/assets/img/mark.svg" | relative_url }}"
      type="image/svg+xml"
    >
    <link
      rel="stylesheet"
      href="{{ "/assets/css/main.css" | relative_url }}"
    >
    {% feed_meta %}
  </head>
  <body>
    {{ content }}
  </body>
</html>
